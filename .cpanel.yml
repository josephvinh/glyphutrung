---
# ============================================================
#  cPanel Git™ Version Control — deploy tự động
#
#  Cách hoạt động: trong cPanel bấm "Update from Remote" rồi "Deploy
#  HEAD Commit", cPanel sẽ `git pull` vào thư mục CLONE rồi chạy các
#  lệnh dưới đây (thư mục hiện hành = thư mục clone).
#
#  Mô hình: có 2 thư mục
#    - Thư mục CLONE  : nơi cPanel giữ repo (ví dụ ~/repositories/tntt)
#    - Thư mục APP    : nơi web chạy thật ($DEPLOYPATH). Document root
#                       của tên miền phải trỏ vào  $DEPLOYPATH/public
#
#  rsync copy code sang APP nhưng GIỮ NGUYÊN các thứ RIÊNG của máy chủ:
#    - config/config.php        (thông tin DB + secret production)
#    - config/config.local.php  (nếu sau này tách cấu hình riêng)
#    - config/backup/           (sao lưu, có tên thật thiếu nhi)
#  -> nhờ vậy mỗi lần deploy KHÔNG làm mất cấu hình/ dữ liệu máy chủ.
#
#  DEPLOYPATH tự lấy từ $HOME nên KHÔNG cần sửa user. Muốn đổi tên thư
#  mục app thì sửa "tntt-app" bên dưới.
#     Lần deploy đầu, tự tạo config/config.php trong $DEPLOYPATH với
#     thông tin DB của AZDIGI (xem docs/DEPLOY-AZDIGI.md Bước 5).
#
#  Nếu hosting KHÔNG có rsync: đổi dòng rsync thành lệnh cp trong
#  phần ghi chú ở cuối tệp.
#
#  Migration (thêm module/vai) KHÔNG chạy tự động ở đây — cố ý, vì đó
#  là việc một lần và cần cân nhắc. Chạy tay qua SSH khi cần
#  (xem docs/DEPLOY-AZDIGI.md Bước 6).
# ============================================================
deployment:
  tasks:
    - export DEPLOYPATH="$HOME/tntt-app"
    - /bin/mkdir -p "$DEPLOYPATH"
    - /usr/bin/rsync -a --delete --exclude=.git --exclude=.github --exclude=.claude --exclude=docs --exclude=config/config.php --exclude=config/config.local.php --exclude=config/backup ./ "$DEPLOYPATH/"
    - /bin/echo "Deploy xong -> $DEPLOYPATH (docroot phải trỏ vào $DEPLOYPATH/public)"

# ------------------------------------------------------------
# Nếu không có rsync, thay dòng rsync ở trên bằng 3 dòng sau
# (copy đè, giữ config.php/backup vì chỉ copy khi nguồn mới hơn):
#   - /bin/cp -Rf public api assets 2>/dev/null || true
#   - /bin/cp -Rf views "$DEPLOYPATH/" ; /bin/cp -Rf public "$DEPLOYPATH/"
#   - /bin/cp -f config/*.php "$DEPLOYPATH/config/" 2>/dev/null; # rồi TỰ giữ lại config.php bằng tay
# (rsync gọn và an toàn hơn nhiều — ưu tiên xin host bật rsync.)
# ------------------------------------------------------------
