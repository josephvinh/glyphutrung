name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  php-unit:
    name: PHPUnit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql

      - name: Download PHPUnit PHAR
        run: |
          curl -sL https://phar.phpunit.de/phpunit-10.phar -o phpunit10.phar
          chmod +x phpunit10.phar

      - name: Run PHPUnit
        run: php phpunit10.phar --testsuite "TNTT Unit Tests"

  php-syntax:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check PHP Syntax
        run: |
          fail=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null 2>&1 || { echo "❌ Syntax error in: $f"; php -l "$f"; fail=1; }
          done < <(find . -path ./vendor -prune -o -path ./node_modules -prune -o -name '*.php' -print)
          if [ "$fail" -ne 0 ]; then echo "PHP syntax check FAILED"; exit 1; fi
          echo "✅ PHP syntax check passed"

  js-lint:
    name: JavaScript Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ESLint
        run: npm install eslint --save-dev

      - name: Run ESLint
        run: npx eslint public/assets/js/ || true
