<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    BIỂU TƯỢNG APP
    Dùng lại đúng hình trong thanh bên: nền chuyển sắc xanh, bo góc lớn,
    hình nhà thờ trắng. Vẽ bằng SVG nên nét sắc ở mọi cỡ, nặng chưa tới 1 KB.

    ĐỔI SANG LOGO GIÁO XỨ: thay cả tệp này bằng SVG của giáo xứ (giữ
    nguyên tên icon.svg), rồi chạy  node build/tao_icon.cjs  để sinh lại
    các bản PNG.
  -->
  <defs>
    <linearGradient id="nen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#nen)"/>

